version: "3.9"

services:
  app:
    build:
      context: .
    volumes:
      - ./backend:/app
    env_file:
      - .env
    restart: on-failure
    command: >
      sh -c "python manage.py wait_db && python manage.py runserver 0.0.0.0:8000"

  db:
    image: mysql:8
    volumes:
      - ./mysql:/var/lib/mysql
    ports:
      - "3307:3306"
    env_file:
      - .env
    restart: on-failure

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/static:/usr/share/nginx/doc
    restart: on-failure


  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - default

  celery:
    build:
      context: .
    volumes:
      - ./backend:/app
    env_file:
      - .env
    restart: on-failure
    command: >
      sh -c "celery -A configs worker -l info"
#      sh -c "celery -A configs worker -l info -B"

  flower:
      image: mher/flower:latest
      ports:
        - "5555:5555"
      environment:
        - CELERY_BROKER_URL=redis://redis:6379/0
      command: celery --broker=redis://redis:6379/0 flower --port=5555
      restart: on-failure
      depends_on:
        - redis
        - celery